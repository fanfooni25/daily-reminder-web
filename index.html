<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f7f4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>每日用药提醒</title>
<style>
:root{color-scheme:light;--ink:#182821;--muted:#65766e;--green:#176b4b;--mint:#e7f2eb;--line:#e4eae5;--paper:#fff;--bg:#f5f7f4;--amber:#9d5b12;--amber-bg:#fff4e2;--shadow:0 12px 32px #1b39200d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:16px;line-height:1.5}button,input{font:inherit}button{cursor:pointer}.app{max-width:640px;margin:0 auto;padding:env(safe-area-inset-top) 18px calc(28px + env(safe-area-inset-bottom))}.top{display:flex;align-items:center;justify-content:space-between;padding:20px 0 12px}.brand{display:flex;align-items:center;gap:10px;font-weight:750;font-size:17px}.brandmark{width:38px;height:38px;background:var(--mint);color:var(--green);border-radius:13px;display:grid;place-items:center;font-size:21px}.iconbtn{width:42px;height:42px;border:1px solid var(--line);border-radius:14px;background:white;color:var(--ink);font-size:20px}.hero{padding:18px 2px 20px}.eyebrow{font-size:13px;color:var(--muted);letter-spacing:.04em}.hero h1{font-size:29px;line-height:1.22;margin:5px 0 8px;letter-spacing:-.03em}.date{color:var(--muted);font-size:15px}.progress{margin-top:18px;background:white;border:1px solid var(--line);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow)}.progressline{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:650}.bar{height:8px;background:#edf1ed;border-radius:9px;margin-top:10px;overflow:hidden}.bar span{height:100%;display:block;width:0;background:var(--green);border-radius:9px;transition:width .2s}.notice{margin:14px 0 18px;padding:12px 14px;border-radius:14px;background:#eef3f0;color:#46594f;font-size:13px}.notice strong{color:var(--ink)}.noticebutton{margin-top:10px;border:0;border-radius:11px;background:var(--green);color:#fff;padding:9px 12px;font-weight:650;font-size:13px}.section{margin-top:20px}.sectionhead{display:flex;align-items:center;gap:10px;margin:0 2px 10px}.sectionhead h2{font-size:17px;margin:0}.sectionhead .dot{width:9px;height:9px;border-radius:50%;background:var(--green)}.sectionhead time{margin-left:auto;font-size:13px;color:var(--muted)}.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}.task{display:flex;align-items:center;gap:13px;padding:15px 14px;min-height:72px;border-top:1px solid var(--line)}.task:first-child{border-top:0}.check{appearance:none;flex:0 0 25px;width:25px;height:25px;border:2px solid #c4d0c8;border-radius:8px;background:white;display:grid;place-items:center;margin:0}.check:checked{border-color:var(--green);background:var(--green)}.check:checked:after{content:'✓';color:#fff;font-weight:800;font-size:16px}.taskbody{min-width:0;flex:1}.tasktitle{font-weight:650;font-size:16px;line-height:1.35}.taskmeta{color:var(--muted);font-size:13px;margin-top:3px}.task.done .tasktitle{text-decoration:line-through;color:#78877f}.tag{display:inline-flex;align-items:center;white-space:nowrap;border-radius:20px;padding:4px 9px;background:var(--mint);color:var(--green);font-size:12px;font-weight:650}.tag.pending{background:var(--amber-bg);color:var(--amber)}.info{border-top:1px solid var(--line);padding:13px 14px;color:#617168;font-size:13px;background:#fbfcfb}.footer{color:#7b8981;font-size:12px;padding:20px 3px;text-align:center}.settingsveil{position:fixed;inset:0;background:#10221977;display:none;align-items:flex-end;justify-content:center;z-index:5}.settingsveil.open{display:flex}.sheet{width:min(100%,640px);max-height:92dvh;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -12px 40px #0c1b1322}.sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}.sheet h2{margin:0;font-size:21px}.sheet p{color:var(--muted);font-size:13px;margin:5px 0 18px}.field{background:white;border:1px solid var(--line);border-radius:15px;padding:12px 13px;margin:9px 0}.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}.field input{border:0;outline:none;width:100%;color:var(--ink);background:transparent;font-size:16px}.fieldrow{display:grid;grid-template-columns:1fr 120px;gap:9px}.actions{display:flex;gap:10px;margin-top:16px}.primary,.secondary{border:0;border-radius:14px;padding:13px 14px;font-weight:700}.primary{background:var(--green);color:white;flex:1}.secondary{background:#e9efeb;color:var(--ink)}.settingslink{color:var(--green);font-weight:650;text-decoration:none}.toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#183b2b;color:#fff;border-radius:22px;padding:10px 16px;font-size:14px;transition:.2s;z-index:8;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<main class="app">
  <header class="top"><div class="brand"><span class="brandmark">✓</span><span>每日用药提醒</span></div><button class="iconbtn" id="openSettings" aria-label="设置提醒">⚙</button></header>
  <section class="hero"><div class="eyebrow">今天的安排</div><h1 id="greeting">一天一步，按时照顾自己</h1><div class="date" id="today"></div>
    <div class="progress"><div class="progressline"><span>今日完成</span><span id="count">0 / 4</span></div><div class="bar"><span id="progressbar"></span></div></div>
  </section>
  <div class="notice"><strong>按医嘱执行。</strong> 这页只记录和勾选，不替代医生处方，也不会自行推算剂量。<br><button class="noticebutton" id="enableNotifications">开启本页通知</button></div>
  <div id="schedule"></div>
  <div class="section"><a class="settingslink" href="#" id="settingsText">编辑药名和提醒时间　›</a></div>
  <div class="footer">勾选记录保存在这台设备的浏览器中，每天自动开始新的一天。建议把网页加入手机主屏幕。</div>
</main>
<div class="settingsveil" id="veil" role="dialog" aria-modal="true" aria-labelledby="settingTitle">
 <section class="sheet"><div class="sheethead"><h2 id="settingTitle">提醒设置</h2><button class="iconbtn" id="closeSettings" aria-label="关闭">×</button></div><p>可以修改显示名称和时间。时间留空时只显示“待设置”，不会触发页面内提示。</p><div id="fields"></div><div class="actions"><button class="secondary" id="resetSettings">恢复初始内容</button><button class="primary" id="saveSettings">保存设置</button></div></section>
</div><div class="toast" id="toast"></div>
<script>
const defaults=[
 {id:'thyroid',group:'早晨',time:'',name:'优甲乐',detail:'待确认服药时间；通常空腹、早餐前服用',type:'pill'},
 {id:'insulin-am',group:'早晨',time:'07:30',name:'注射人胰岛素',detail:'饭前',type:'insulin'},
 {id:'glucose-am',group:'早晨',time:'',name:'降血糖药（名称待补）',detail:'待设置服用时间和随餐方式',type:'pill'},
 {id:'pressure-am',group:'早晨',time:'',name:'坎地清塞片',detail:'高血压药 · 待确认服用时间',type:'pill'},
 {id:'insulin-noon',group:'中午',time:'12:30',name:'注射人胰岛素',detail:'饭前',type:'insulin'},
 {id:'glucose-noon',group:'中午',time:'',name:'降血糖药（名称待补）',detail:'待设置服用时间和随餐方式',type:'pill'},
 {id:'insulin-pm',group:'晚上',time:'',name:'注射人胰岛素',detail:'饭前 · 时间暂定 18:00–19:00，请选定具体时间',type:'insulin'},
 {id:'glucose-pm',group:'晚上',time:'',name:'降血糖药（名称待补）',detail:'待设置服用时间和随餐方式',type:'pill'},
 {id:'pressure-pm',group:'晚上',time:'',name:'坎地清塞片',detail:'高血压药 · 是否晚上服用待确认',type:'pill'},
 {id:'basal',group:'睡前',time:'22:00',name:'注射精甘胰岛素',detail:'睡前 · 药名按你提供的称呼记录，请核对药盒',type:'insulin'}
];
const groups=['早晨','中午','晚上','睡前'];let items=loadItems();let checks=loadChecks();let notified=new Set();
function loadItems(){try{const x=JSON.parse(localStorage.getItem('dailyReminderItems'));return Array.isArray(x)&&x.length?x:structuredClone(defaults)}catch{return structuredClone(defaults)}}
function loadChecks(){try{let x=JSON.parse(localStorage.getItem(checkKey()));return x&&typeof x==='object'?x:{}}catch{return {}}}
function dayKey(){let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function checkKey(){return 'dailyReminderChecks-'+dayKey()}
function fmtDate(){return new Intl.DateTimeFormat('zh-CN',{weekday:'long',year:'numeric',month:'long',day:'numeric'}).format(new Date())}
function render(){document.getElementById('today').textContent=fmtDate();const area=document.getElementById('schedule');area.innerHTML='';for(const group of groups){const rows=items.filter(x=>x.group===group);if(!rows.length)continue;const section=document.createElement('section');section.className='section';const h=document.createElement('div');h.className='sectionhead';h.innerHTML=`<span class="dot"></span><h2>${group}</h2><time>${group==='早晨'?'起床后与早餐前':group==='中午'?'午餐前后':group==='晚上'?'晚餐前后':'约 22:00'}</time>`;section.append(h);const card=document.createElement('div');card.className='card';for(const item of rows){const row=document.createElement('label');row.className='task'+(checks[item.id]?' done':'');const check=document.createElement('input');check.type='checkbox';check.className='check';check.checked=!!checks[item.id];check.setAttribute('aria-label',`完成：${item.name}`);check.addEventListener('change',()=>{checks[item.id]=check.checked;localStorage.setItem(checkKey(),JSON.stringify(checks));render()});const body=document.createElement('span');body.className='taskbody';const title=document.createElement('span');title.className='tasktitle';title.textContent=item.name;const meta=document.createElement('span');meta.className='taskmeta';meta.textContent=[item.time||'时间待设置',item.detail].filter(Boolean).join(' · ');body.append(title,document.createElement('br'),meta);const tag=document.createElement('span');tag.className='tag'+(!item.time?' pending':'');tag.textContent=item.time||'待设置';row.append(check,body,tag);card.append(row)}section.append(card);area.append(section)}const done=items.filter(x=>checks[x.id]).length;document.getElementById('count').textContent=`${done} / ${items.length}`;document.getElementById('progressbar').style.width=`${items.length?done/items.length*100:0}%`}
function open(){fillFields();document.getElementById('veil').classList.add('open')};function close(){document.getElementById('veil').classList.remove('open')}
function fillFields(){const root=document.getElementById('fields');root.innerHTML='';for(const item of items){const div=document.createElement('div');div.className='field';const label=document.createElement('label');label.textContent=`${item.group} · ${item.id==='insulin-pm'?'晚餐前':item.id==='basal'?'睡前':item.id==='thyroid'?'早餐前':item.name}`;const row=document.createElement('div');row.className='fieldrow';const name=document.createElement('input');name.value=item.name;name.dataset.id=item.id;name.dataset.key='name';name.setAttribute('aria-label','提醒名称');const time=document.createElement('input');time.type='time';time.value=item.time||'';time.dataset.id=item.id;time.dataset.key='time';time.setAttribute('aria-label','提醒时间');row.append(name,time);div.append(label,row);root.append(div)}}
document.getElementById('openSettings').onclick=open;document.getElementById('settingsText').onclick=e=>{e.preventDefault();open()};document.getElementById('closeSettings').onclick=close;document.getElementById('veil').onclick=e=>{if(e.target.id==='veil')close()};document.getElementById('saveSettings').onclick=()=>{for(const input of document.querySelectorAll('#fields input')){const item=items.find(x=>x.id===input.dataset.id);if(item)item[input.dataset.key]=input.value.trim()}localStorage.setItem('dailyReminderItems',JSON.stringify(items));render();close();toast('设置已保存到这台设备')};document.getElementById('resetSettings').onclick=()=>{items=structuredClone(defaults);localStorage.removeItem('dailyReminderItems');fillFields();render();toast('已恢复初始内容')};
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2200)}
function notifyDue(){if(!('Notification'in window)||Notification.permission!=='granted')return;const now=new Date();const key=`${dayKey()}-${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;items.filter(i=>i.time===key.slice(11)).forEach(i=>{const id=key+'-'+i.id;if(notified.has(id)||checks[i.id])return;notified.add(id);new Notification('每日用药提醒',{body:`${i.name}${i.detail?' · '+i.detail:''}`,tag:i.id})})}
document.getElementById("enableNotifications").onclick=async()=>{if(!( "Notification" in window)){toast("此浏览器不支持网页通知");return}try{const p=await Notification.requestPermission();toast(p==="granted"?"已开启：网页保持打开时会按设置时间提醒":"未获得通知权限，可在浏览器设置中开启")}catch{toast("请通过浏览器打开网页并允许通知")}};render();setInterval(notifyDue,15000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)notifyDue()});
</script>
</body>
</html>
